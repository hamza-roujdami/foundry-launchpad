name: Bicep

on:
  pull_request:
    paths:
      - "infra/bicep/**"
      - ".github/workflows/bicep.yml"
  push:
    branches: [main]
    paths:
      - "infra/bicep/**"
      - ".github/workflows/bicep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install --version v0.46.1
      - run: bash infra/bicep/validate.sh
