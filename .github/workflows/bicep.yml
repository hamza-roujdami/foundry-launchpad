name: Bicep

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "infra/bicep/**"
      - "infra/scripts/**"
      - "infra/tests/**"
      - ".github/workflows/bicep.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "infra/bicep/**"
      - "infra/scripts/**"
      - "infra/tests/**"
      - ".github/workflows/bicep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: az bicep install --version v0.46.1
      - run: bash infra/bicep/validate.sh
      - run: python3 -m unittest discover -s infra/tests -p 'test_*.py'
