      .tag { font-size: 14px; font-weight: 700; letter-spacing: 1px; fill: #1264a3; }
      .card { fill: #fff; stroke: #c6d6e7; stroke-width: 1.5; }
      .boundary { fill: #f0f7ff; stroke: #8ebdf0; stroke-width: 2; }
