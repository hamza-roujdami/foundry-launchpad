<svg xmlns="http://www.w3.org/2000/svg" width="2080" height="1440" viewBox="0 0 2080 1440" role="img" aria-labelledby="title description">
  <title id="title">Foundry Launchpad - private AI foundation</title>
  <desc id="description">Non-production reference infrastructure in Central US: two existing subscriptions and five resource groups. The ai-spoke subscription contains shared Foundry with two projects, ACR, networking, and two dedicated application infrastructure groups. The ai-hub subscription contains the private APIM AI gateway, three model aliases, Content Safety, networking, private DNS and AMPLS. Model calls go through APIM. Git setup, application CI/CD, developer connectivity and enterprise landing-zone design are outside scope.</desc>
